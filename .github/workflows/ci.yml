# CI — 타입 검증 · 전체 테스트 · 복구 리허설.
#
# 왜 이 셋인가:
#  - 타입 검증: Core 는 채널 3곳이 소비하는 라이브러리다. 계약이 깨지면 세 저장소가 동시에 깨진다.
#  - 테스트: 실패 경로(마스킹 누락·테넌트 혼입·부분 실패)를 사람이 매번 손으로 확인할 수 없다.
#  - 복구 리허설: 백업은 "돌려봤는가"로만 증명된다. 절차 리허설은 참조 구현이라 CI에서 매번 돌 수 있다.
#
# 실엔진·실회선·실 DB 에는 붙지 않는다. 어댑터는 모두 dry_run 기본값이다 — 실활성화는 [승인 필요].
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 테스트가 소스(.ts)를 그대로 import 하므로 타입 스트리핑을 지원하는 런타임이 필요하다.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # 의존성은 devDependencies(typescript·@types/node)뿐이다. 락파일이 없어도 실패하지 않게 install 을 쓴다.
      - name: install
        run: npm install --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      # 종료코드 0=통과, 1=실패, 2=판정보류. 판정보류도 통과로 넘기지 않는다.
      - name: recovery drill
        run: node scripts/recovery-drill.mjs

      # 채널 저장소(Callbot·챗봇·D-ARS)는 자기 CI에서 이 스위트를 자기 ChannelPort 구현에 대고 돌린다.
      # 여기서는 참조 드라이런 포트가 계약을 계속 만족하는지만 확인한다.
      - name: channel contract conformance (reference dry-run port)
        run: node --test tests/channels.conformance.test.mjs tests/channels.basePort.test.mjs

      # 채널 저장소가 실제로 부를 실행기 자체가 도는지 확인한다. 스위트가 멀쩡해도 실행기가
      # 깨져 있으면 세 저장소의 CI 가 동시에 멈춘다. 종료코드 0=통과·1=실패·2=판정보류를 그대로 쓴다.
      - name: channel conformance runner (self-check)
        run: node scripts/channel-conformance.mjs --port ./fixtures/reference-port.mjs --flows ./fixtures/reference-flows.mjs --adapter chatbot --timeout-ms 2000

      # 관리 포털 IA ↔ 화면 매핑 문서는 자료(src/portal/screenMap.ts)에서 생성된다.
      # 손으로 고친 표는 반드시 썩으므로, 생성 결과와 다르면 여기서 멈춘다.
      - name: portal screen map (doc freshness)
        run: node scripts/screen-map.mjs --check

      # 커버리지는 **측정**이다. 임계값(AICC_COVERAGE_MIN_*)을 주지 않으면 게이트로 쓰지 않는다 —
      # 근거 없는 목표치를 CI에 박지 않기 위해서다(§13-3). 실측 추이를 보고 사람이 임계값을 정하면
      # 그때 환경변수로 켜면 된다. 테스트가 깨진 상태의 수치는 근거가 아니므로 무조건 실패로 끝난다.
      - name: coverage (measure)
        run: node scripts/coverage.mjs
